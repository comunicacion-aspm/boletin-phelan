name: Boletín diario

on:
  schedule:
    - cron: "30 5 * * *"   # todos los días a las 05:30 UTC (07:30 en verano / 06:30 en invierno, hora de Madrid)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar boletín
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build.py

      - name: Guardar histórico en el repositorio
        run: |
          git config user.name "boletin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Boletín $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
