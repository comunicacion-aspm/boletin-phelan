name: Boletín diario

on:
  schedule:
    # De lunes a viernes a las 08:30 hora de Madrid. GitHub solo entiende UTC, así que hay
    # dos horarios (verano e invierno) y el trabajo "hora" deja pasar solo el que toca.
    - cron: "30 6 * * 1-5"   # 08:30 en horario de verano (UTC+2)
    - cron: "30 7 * * 1-5"   # 08:30 en horario de invierno (UTC+1)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:                     # el Estudio de redes sube imágenes y vídeos aprobados para Metricool
    branches: [main]        # y el Mac lanza el boletín a las 08:30 (disparador/), porque el
    paths: ["docs/medios/**", "disparador/**"]   # cron de GitHub llega con horas de retraso

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
      generar: ${{ steps.comprobar.outputs.generar }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/ediciones
      - id: comprobar
        env:
          EVENTO: ${{ github.event_name }}
          PROGRAMACION: ${{ github.event.schedule }}
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)
          hoy=$(TZ=Europe/Madrid date +%F)
          toca=true
          generar=true
          if [ "$PROGRAMACION" = "30 6 * * 1-5" ] && [ "$desfase" != "+0200" ]; then toca=false; fi
          if [ "$PROGRAMACION" = "30 7 * * 1-5" ] && [ "$desfase" != "+0100" ]; then toca=false; fi
          # Si el cron llega tarde y el boletín de hoy ya está hecho (lo lanzó el Mac), no repetir.
          if [ "$EVENTO" = "schedule" ] && [ -f "data/ediciones/$hoy.json" ]; then toca=false; fi
          # Un push solo genera boletín si viene del disparador del Mac; si no, solo publica medios.
          if [ "$EVENTO" = "push" ]; then
            case "$MENSAJE" in
              "Disparar boletín"*) [ -f "data/ediciones/$hoy.json" ] && generar=false ;;
              *) generar=false ;;
            esac
          fi
          echo "toca=$toca" >> "$GITHUB_OUTPUT"
          echo "generar=$generar" >> "$GITHUB_OUTPUT"

  generar:
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.intento.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar boletín
        if: needs.hora.outputs.generar == 'true'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build.py

      - name: Guardar histórico en el repositorio
        if: needs.hora.outputs.generar == 'true'
        run: |
          git config user.name "boletin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Boletín $(TZ=Europe/Madrid date +%F)"
          git pull --rebase -q || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # A veces Pages rechaza el despliegue si hay otro en curso: se reintenta una vez.
      - id: intento
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.intento.outcome == 'failure'
        run: sleep 60
      - id: despliegue
        if: steps.intento.outcome == 'failure'
        uses: actions/deploy-pages@v4
