name: Boletín diario

on:
  schedule:
    # De lunes a viernes a las 08:30 hora de Madrid. GitHub solo entiende UTC, así que hay
    # dos horarios (verano e invierno) y el trabajo "hora" deja pasar solo el que toca.
    - cron: "30 6 * * 1-5"   # 08:30 en horario de verano (UTC+2)
    - cron: "30 7 * * 1-5"   # 08:30 en horario de invierno (UTC+1)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - id: comprobar
        env:
          PROGRAMACION: ${{ github.event.schedule }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)
          toca=true
          if [ "$PROGRAMACION" = "30 6 * * 1-5" ] && [ "$desfase" != "+0200" ]; then toca=false; fi
          if [ "$PROGRAMACION" = "30 7 * * 1-5" ] && [ "$desfase" != "+0100" ]; then toca=false; fi
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

  generar:
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar boletín
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build.py

      - name: Guardar histórico en el repositorio
        run: |
          git config user.name "boletin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Boletín $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
